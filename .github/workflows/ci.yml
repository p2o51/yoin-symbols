name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated:
    name: Generated files match the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r generator/requirements.txt
      - run: python3 generator/build.py
      - name: Fail if anything changed
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :yoin-symbols:assembleRelease :yoin-symbols:publishReleasePublicationToStagingRepository

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Package loads
        run: node --input-type=module -e "const m = await import('./dist/index.js'); if (m.names.length !== Object.keys(m.symbols).length || !m.toSvg('home').startsWith('<svg')) process.exit(1)"
      - run: npm pack --dry-run

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter pub publish --dry-run
