name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

  maven:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Upload to Maven Central
        # Uploads and validates only. The deployment waits on central.sonatype.com
        # until someone presses Publish there.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" || { echo "SIGNING_KEY is not set"; exit 1; }
          ./gradlew :yoin-symbols:publishToMavenCentral

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm publish --access public

  pub:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force

  github:
    needs: [maven, npm, pub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr "yoin-symbols-svg-${GITHUB_REF_NAME}.zip" svg LICENSE
          gh release create "$GITHUB_REF_NAME" \
            --title "Yoin Symbols ${GITHUB_REF_NAME}" \
            --generate-notes \
            "yoin-symbols-svg-${GITHUB_REF_NAME}.zip" web/font/YoinSymbols.ttf web/font/YoinSymbols.woff2
